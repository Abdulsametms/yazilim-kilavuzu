<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetim Girişi - Yazılım Kılavuzu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; }
        .neon-glow { text-shadow: 0 0 15px rgba(0, 243, 255, 0.5); }
        .neon-btn { background: #00f3ff; color: #0b0f19; transition: all 0.3s ease; }
        .neon-btn:hover { box-shadow: 0 0 20px #00f3ff; background: #00d2df; }
        .card-bg { background-color: #131b2e; border: 1px solid #1f293d; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="max-w-md w-full card-bg p-8 rounded-xl border border-gray-700 shadow-xl text-left">
        <h1 class="text-2xl font-bold text-cyan-400 mb-6 text-center neon-glow">Yönetim Paneli Giriş</h1>
        
        {% if hata %}
        <div class="bg-red-950/40 border border-red-500 text-red-300 p-3 rounded-lg mb-4 text-center text-xs font-semibold">
            {{ hata }}
        </div>
        {% endif %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">Kullanıcı Adı</label>
                <input type="text" name="username" required class="w-full bg-gray-900 border border-gray-700 p-3 rounded-lg text-white text-sm focus:border-cyan-400 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">Şifre</label>
                <input type="password" name="password" required class="w-full bg-gray-900 border border-gray-700 p-3 rounded-lg text-white text-sm focus:border-cyan-400 focus:outline-none">
            </div>
            <button type="submit" class="w-full py-3 rounded-lg font-bold neon-btn text-sm">Giriş Yap</button>
        </form>
        <div class="text-center mt-6">
            <a href="/" class="text-xs text-gray-400 hover:text-white transition">← Ana Sayfaya Geri Dön</a>
        </div>
    </div>
</body>
</html>
